# Автоматические обновления GitHub Actions.
# Сборка опирается на сторонние экшены (docker/*), поэтому за ними нужно следить.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: 'ci'
    # Все обновления экшенов приезжают одним PR: каждый PR здесь запускает
    # полную сборку образа, а поодиночке на пять экшенов это пять прогонов CI.
    groups:
      github-actions:
        patterns:
          - '*'