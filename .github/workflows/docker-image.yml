# ─────────────────────────────────────────────────────────────────────────────
# Сборка и публикация Docker-образа Telegram Bot API.
#
# Компиляция TDLib тяжёлая (15–20 минут), поэтому:
#   - при пуше в main собираются обе архитектуры (amd64 и нативный arm64),
#     затем собирается мультиархитектурный манифест и прогоняется smoke-тест;
#   - в pull_request собирается только amd64 — этого достаточно, чтобы
#     проверить Dockerfile и патч, не тратя ~30 минут CI.
#
# Ручной запуск: вкладка Actions → Docker Image → Run workflow, там можно
# указать ветку апстрима telegram-bot-api и значение таймаута.
# ─────────────────────────────────────────────────────────────────────────────

name: Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tgbotapi_ref:
        description: 'Ветка/тег апстрима telegram-bot-api (TGBOTAPI_REF)'
        required: false
        default: 'master'
      idle_timeout:
        description: 'Таймаут простоя HTTP-соединения, секунды (TGBOTAPI_IDLE_TIMEOUT)'
        required: false
        default: '14400'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  ALPINE_VERSION: '3.20'
  # inputs пуст при push/pull_request, поэтому нужен запасной вариант.
  TGBOTAPI_REF: ${{ inputs.tgbotapi_ref || 'master' }}
  TGBOTAPI_IDLE_TIMEOUT: ${{ inputs.idle_timeout || '14400' }}
  # Матрицы сборки. В PR достаточно одной архитектуры, при пуше в main нужны обе.
  # Раннеры зафиксированы на ubuntu-24.04: метка ubuntu-latest переезжает на
  # Ubuntu 26, и такое тихое изменение ОС ломает сборки без предупреждения.
  RUNNER_AMD64: 'ubuntu-24.04'
  RUNNER_ARM64: 'ubuntu-24.04-arm'
  MATRIX_PR: '[{"slug":"amd64","platform":"linux/amd64"}]'
  MATRIX_PUSH: >-
    [{"slug":"amd64","platform":"linux/amd64"},{"slug":"arm64","platform":"linux/arm64"}]

jobs:
  build:
    name: Сборка ${{ matrix.platform }}
    runs-on: ${{ matrix.slug == 'arm64' && env.RUNNER_ARM64 || env.RUNNER_AMD64 }}
    timeout-minutes: 300

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && env.MATRIX_PR || env.MATRIX_PUSH) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Подготовка QEMU
        uses: docker/setup-qemu-action@v4

      - name: Подготовка Buildx
        uses: docker/setup-buildx-action@v4

      - name: Определение числа ядер
        run: echo "NPROC=$(nproc)" >> "$GITHUB_ENV"

      - name: Логин в GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Сборка ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            TGBOTAPI_REF=${{ env.TGBOTAPI_REF }}
            TGBOTAPI_IDLE_TIMEOUT=${{ env.TGBOTAPI_IDLE_TIMEOUT }}
            nproc=${{ env.NPROC }}
          # Пушим по дигесту: мультиархитектурный манифест собирается отдельным
          # шагом после того, как успешно собраны все архитектуры.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          # Кэш записываем только из main: кэш, созданный в PR, виден только
          # самому PR и бесполезен для последующих сборок.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.slug) || '' }}

      - name: Сохранение дигеста
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/digest-${{ matrix.slug }}.txt"
          cat "/tmp/digests/digest-${{ matrix.slug }}.txt"

      - name: Загрузка артефакта с дигестом
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.slug }}
          # Имя файла ВНУТРИ артефакта должно совпадать с шаблоном digest-*.txt
          # в job'е merge: download-artifact с merge-multiple раскладывает
          # файлы как есть, без имени артефакта.
          path: /tmp/digests/digest-${{ matrix.slug }}.txt
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Сборка манифеста
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Подготовка Buildx
        uses: docker/setup-buildx-action@v4

      - name: Скачивание дигестов
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Объединение дигестов
        run: |
          set -euo pipefail
          cd /tmp/digests

          # nullglob: если шаблон ничего не нашёл, массив будет пустым, а не
          # станет раскрываться в буквальное имя файла. Иначе cat ниже упал бы
          # с непонятным "No such file or directory".
          shopt -s nullglob
          digest_files=(digest-*.txt)
          if [ ${#digest_files[@]} -eq 0 ]; then
            echo "::error::не найдено ни одного файла digest-*.txt"
            ls -la /tmp/digests
            exit 1
          fi

          sources=""
          for digest_file in "${digest_files[@]}"; do
            digest=$(cat "$digest_file")
            if [ -z "${digest}" ]; then
              echo "::error::в ${digest_file} пустой дигест"
              exit 1
            fi
            echo "Используем дигест из ${digest_file}: ${digest}"
            sources="${sources} ${IMAGE_NAME}@${digest}"
          done

          # Обрезаем ведущий пробел, чтобы результат можно было подставить
          # через $(cat ...) без лишнего пустого аргумента.
          echo "${sources# }" > sources.txt
          cat sources.txt

      - name: Метаданные образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Логин в GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Создание мультиархитектурного манифеста
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(cat /tmp/digests/sources.txt) \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_JSON")
          # Печатаем итоговые теги, чтобы было видно, что опубликовано.
          docker buildx imagetools inspect \
            $(jq -r '.tags[0]' <<< "$DOCKER_METADATA_JSON") | head -20

      - name: Загрузка артефакта с итоговым списком источников
        uses: actions/upload-artifact@v7
        with:
          name: metadata
          path: /tmp/digests/sources.txt

  smoke:
    name: Проверка запуска
    needs: build
    # Только при пуше в main: там сборка уже прогрелась и лежит в кэше, поэтому
    # повторная сборка занимает секунды. В PR кэш недоступен, и проверка
    # удвоила бы время CI.
    if: always() && github.event_name != 'pull_request' && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Подготовка Buildx
        uses: docker/setup-buildx-action@v4

      - name: Определение числа ядер
        run: echo "NPROC=$(nproc)" >> "$GITHUB_ENV"

      # Компиляция берётся из кэша, который выгрузил job build.
      - name: Сборка образа для проверки
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: telegram-bot-api-patched:smoke
          build-args: |
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            TGBOTAPI_REF=${{ env.TGBOTAPI_REF }}
            TGBOTAPI_IDLE_TIMEOUT=${{ env.TGBOTAPI_IDLE_TIMEOUT }}
            nproc=${{ env.NPROC }}
          cache-from: type=gha,scope=amd64

      # Проверяем, что бинарник вообще запускается в runtime-образе: без
      # зависимостей из стадии сборки он упал бы с "error while loading shared
      # libraries". --version завершает работу с кодом 0 до обращения к Telegram.
      - name: Проверка бинарника
        run: |
          docker run --rm \
            --entrypoint /usr/local/bin/telegram-bot-api \
            telegram-bot-api-patched:smoke --version

      # Entrypoint обязан падать, если не заданы обязательные переменные.
      - name: Проверка entrypoint
        run: |
          if docker run --rm \
            --entrypoint /docker-entrypoint.sh \
            telegram-bot-api-patched:smoke; then
            echo "::error::entrypoint не должен стартовать без TELEGRAM_API_ID/TELEGRAM_API_HASH"
            exit 1
          fi
          echo "entrypoint корректно отверг запуск без учётных данных"